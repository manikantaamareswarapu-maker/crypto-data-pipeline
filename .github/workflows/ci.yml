name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python files compile
        run: |
          python -m py_compile lambdas/ingestion/handler.py
          python -m py_compile lambdas/processing_trigger/handler.py
          echo "All Python files compiled successfully"
